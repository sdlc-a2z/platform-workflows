# Terraform for an environment: plan on a pull request, apply on merge.
#
# The point is that nobody applies from a laptop. What is running is whatever main says is
# running, and a hand-applied change shows up as drift on the next plan rather than never.
#
#   jobs:
#     terraform:
#       uses: sdlc-a2z/platform-workflows/.github/workflows/terraform.yml@v1
#       with:
#         working-directory: terraform/environments/dev
#         environment: dev
#       permissions: { contents: read, id-token: write, pull-requests: write }
#       secrets: inherit

name: terraform

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      environment:
        description: Used as the GitHub environment, so prod can require a reviewer
        required: true
        type: string
      terraform-version:
        default: '1.15.6'
        type: string

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout otherwise leaves its own token as an extraheader for
          # https://github.com/, which overrides the rewrite below — and that token cannot
          # read a private sibling repository, so Terraform's module fetch gets a 403 that
          # looks like the wrong token rather than the wrong precedence.
          persist-credentials: false

      # The modules are in a private repository, so Terraform's git fetch needs a
      # credential — and this one is broader than it should be.
      #
      # A read-only deploy key scoped to one repository was the right answer; the
      # organisation has deploy keys disabled. A fine-grained token scoped to one
      # repository with Contents: Read-only was the next; it returned 404, and the
      # organisation exposes no approval policy through the API to fix that. What is left
      # is a classic token, whose narrowest usable scope for cloning a private repository
      # is `repo` — read *and write* across every repository the holder can reach.
      #
      # So this is an exception, tracked as R0-WS1-009, not a pattern to copy. If a second
      # repository needs a credential, narrow this one first.
      #
      # oauth2 as the username, not x-access-token: the latter is for GitHub App
      # installation tokens, and with a PAT GitHub answers a *clone* with "Write access to
      # repository not granted" — which sends you to check the token's permissions when
      # the problem is the username in front of it.
      - name: Allow Terraform to fetch private modules
        env:
          MODULES_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          if [ -z "$MODULES_TOKEN" ]; then
            echo "::error::MODULES_READ_TOKEN is not set — terraform init cannot fetch platform-terraform-modules"
            exit 1
          fi
          git config --global url."https://oauth2:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Ask GitHub what the token can see, before Terraform does. A module fetch failure
      # surfaces as "Write access to repository not granted" on a *read*, which says
      # nothing useful — this turns it into the actual reason.
      - name: Check the token reaches the modules repository
        env:
          MODULES_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          # Whose token is it? An account that is not a member of the organisation sees a
          # 404 on a private repository — identical to a scoping problem, and the usual
          # cause when several GitHub accounts are in play.
          who=$(curl -s -H "Authorization: Bearer $MODULES_TOKEN" https://api.github.com/user \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("login", d.get("message","?")))')
          echo "token belongs to: $who   (the organisation's only member is kasimanikandan)"

          # And what kind of token — classic tokens report their scopes in a header;
          # fine-grained ones report none, which tells them apart without printing either.
          scopes=$(curl -s -D - -o /dev/null -H "Authorization: Bearer $MODULES_TOKEN" \
                   https://api.github.com/user | tr -d '\r' | grep -i '^x-oauth-scopes:' || true)
          echo "${scopes:-x-oauth-scopes: (none — this is a fine-grained token)}"

          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $MODULES_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sdlc-a2z/platform-terraform-modules)
          echo "GET /repos/sdlc-a2z/platform-terraform-modules -> $code"
          case "$code" in
            200) echo "✓ the token can read the modules repository" ;;
            404) echo "::error::404 — the token cannot see sdlc-a2z/platform-terraform-modules. Usual cause: it was created with the resource owner set to a personal account rather than the sdlc-a2z organisation, or the organisation has not approved it yet." ; exit 1 ;;
            401) echo "::error::401 — the token is invalid or expired." ; exit 1 ;;
            403) echo "::error::403 — the token is valid but refused. If the organisation requires approval for fine-grained tokens, it is pending at https://github.com/organizations/sdlc-a2z/settings/personal-access-token-requests" ; exit 1 ;;
            *)   echo "::error::unexpected $code" ; cat /tmp/resp.json ; exit 1 ;;
          esac

      # Federation, not a key. The token lives minutes and is bound to this repository.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Format
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -input=false

      - name: Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      # -detailed-exitcode: 0 no changes, 1 error, 2 changes. Distinguishing "no changes"
      # from "changes" is what makes drift visible — a plan that always exits 0 says
      # nothing about whether the world matches the code.
      - name: Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          tail -c 60000 plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1 || exit 0

      - name: Post the plan to the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working-directory }}/plan.txt', 'utf8');
            // GitHub rejects a comment over 65536 characters, and a rejected comment is a
            // plan nobody reviewed.
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n…truncated. Read the full plan in the job log.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — \`${{ inputs.environment }}\`\n\n<details><summary>Show</summary>\n\n\`\`\`hcl\n${body}\n\`\`\`\n\n</details>`
            });

      - name: Keep the plan for apply
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.exitcode == '2'
    # A GitHub environment, so prod can require a reviewer before this job starts. dev has
    # no rule and applies straight through.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Allow Terraform to fetch private modules
        env:
          MODULES_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: git config --global url."https://oauth2:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -input=false

      # The saved plan, not a fresh one. Applying a re-planned change means applying
      # something nobody reviewed — the whole point of the pull request was that specific
      # set of actions.
      - name: Apply
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
