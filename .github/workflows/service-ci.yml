# The shared test gates for every Go service. Called, not copied.
#
# This file is public on purpose: GitHub shares reusable workflows from a private
# repository only with organisations on Team or Enterprise, and sdlc-a2z is on Free.
# Nothing secret is here and nothing should be added — secrets are referenced by *name*
# and their values are injected at run time from the calling repository's own store.
#
# Building and signing the image lives in service-image.yml rather than being a job here,
# and that is not tidiness: GitHub validates every job's `permissions` in a called
# workflow against the caller, including a job whose `if` will skip it. With the image job
# in this file, a library that never builds an image still had to grant `id-token: write`
# just to start.

name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Service name, matching its registry entry
        required: true
        type: string
      go-version:
        # A floor set by the dependency graph, not a preference: otelgrpc and grpc both
        # declare go 1.25.0, so anything lower will not build.
        default: '1.25'
        type: string
      coverage-threshold:
        # The Definition of Done. R0-WS2-002 shipped at 61.5% with its whole interceptor
        # chain untested, which is why this is a gate rather than a habit.
        default: 80
        type: number
      needs-postgres:
        description: Start Postgres and the unprivileged role the tenancy suite needs
        default: true
        type: boolean

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdlc
          # Not a secret. This container lives for the length of one job, listens on the
          # runner's loopback, and is destroyed with it. Real credentials come from Secret
          # Manager through the CSI driver and never appear in a workflow file.
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: sdlc
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 2s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # A workflow that does not parse never runs, and GitHub reports that as a
      # zero-second failure with no log. One sat undetected in this platform for weeks.
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

      - run: go vet ./...
      - run: go build ./...

      # An unprivileged role, because a superuser bypasses RLS: the tenancy suite would
      # pass while proving nothing, which is the commonest way such a suite lies.
      - name: Create the unprivileged test role
        if: inputs.needs-postgres
        env:
          PGPASSWORD: ephemeral-ci-only
        run: |
          psql -h localhost -p 5442 -U sdlc -d sdlc -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='platform_lib_app') \
             THEN CREATE ROLE platform_lib_app LOGIN PASSWORD 'ephemeral-ci-only' NOBYPASSRLS; END IF; END \$\$;"

      - name: Test
        env:
          # The suites t.Fatal rather than skip when CI is set, so the tenancy guarantee
          # can never go untested behind a green build.
          CI: true
          DATABASE_URL: postgres://sdlc:ephemeral-ci-only@localhost:5442/sdlc
          PLATFORM_LIB_TEST_ADMIN_URL: postgres://sdlc:ephemeral-ci-only@localhost:5442/sdlc
          PLATFORM_LIB_TEST_APP_URL: postgres://platform_lib_app:ephemeral-ci-only@localhost:5442/sdlc
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: $total%"
          awk -v t="$total" -v min="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit (t+0 >= min+0) ? 0 : 1 }' || {
              echo "::error::coverage $total% is below the ${{ inputs.coverage-threshold }}% Definition of Done"
              exit 1
            }

      # A CVE in a shared library reaches every service that imports it. GO-2026-6443, a
      # remotely triggerable gRPC server panic, was in the first version pinned.
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
