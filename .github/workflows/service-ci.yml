# The shared test gates for every Go service. Called, not copied.
#
# This file is public on purpose: GitHub shares reusable workflows from a private
# repository only with organisations on Team or Enterprise, and sdlc-a2z is on Free.
# Nothing secret is here and nothing should be added — secrets are referenced by *name*
# and their values are injected at run time from the calling repository's own store.
#
# Building and signing the image lives in service-image.yml rather than being a job here,
# and that is not tidiness: GitHub validates every job's `permissions` in a called
# workflow against the caller, including a job whose `if` will skip it. With the image job
# in this file, a library that never builds an image still had to grant `id-token: write`
# just to start.

name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Service name, matching its registry entry
        required: true
        type: string
      go-version:
        # A floor set by the dependency graph, not a preference: otelgrpc and grpc both
        # declare go 1.25.0, so anything lower will not build.
        default: '1.25'
        type: string
      coverage-threshold:
        # The Definition of Done. R0-WS2-002 shipped at 61.5% with its whole interceptor
        # chain untested, which is why this is a gate rather than a habit.
        default: 80
        type: number
      needs-postgres:
        description: Start Postgres and the unprivileged role the tenancy suite needs
        default: true
        type: boolean

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdlc
          # Not a secret. This container lives for the length of one job, listens on the
          # runner's loopback, and is destroyed with it. Real credentials come from Secret
          # Manager through the CSI driver and never appear in a workflow file.
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: sdlc
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 2s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      # GITHUB_TOKEN never reaches another repository — it is scoped to the one this
      # workflow runs in, by GitHub's own design, no permissions block can widen that. Any
      # Go service that imports platform-contracts and/or platform-lib-go (R0-WS2-008 /
      # ADR-0010: both private, generated code resolves from source at a tag, not from a
      # registry — and platform-lib-go itself has a genuine transitive dependency on
      # platform-contracts, so a caller that only imports platform-lib-go still needs both
      # credentials, R0-WS2-013) needs a real credential to fetch whichever it imports. A
      # shell-level check rather than a step `if:`, because the `secrets` context is not
      # available in a step's `if:` condition at all — actionlint catches this at lint
      # time, not just at a run silently doing nothing. Each credential is independent and
      # silently no-ops on its own when its secret is not set, so this costs nothing to a
      # caller that imports neither, one, or both.
      #
      # Each *_READ_TOKEN must be set per-repository, not as an org secret: on GitHub
      # Free, an organization secret is never visible to a private repository regardless
      # of its visibility setting — it only reaches public repos on this plan. Confirmed
      # live: set org-wide with visibility "all", still arrived here as an empty string.
      # Same shape as WIF_PROVIDER/CI_SERVICE_ACCOUNT, which are repo secrets for the
      # same reason.
      - name: Private module access
        env:
          CONTRACTS_READ_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN }}
          PLATFORM_LIB_GO_READ_TOKEN: ${{ secrets.PLATFORM_LIB_GO_READ_TOKEN }}
        run: |
          private=""
          if [ -n "$CONTRACTS_READ_TOKEN" ]; then
            git config --global "url.https://x-access-token:${CONTRACTS_READ_TOKEN}@github.com/sdlc-a2z/platform-contracts.insteadOf" "https://github.com/sdlc-a2z/platform-contracts"
            private="github.com/sdlc-a2z/platform-contracts"
          fi
          if [ -n "$PLATFORM_LIB_GO_READ_TOKEN" ]; then
            git config --global "url.https://x-access-token:${PLATFORM_LIB_GO_READ_TOKEN}@github.com/sdlc-a2z/platform-lib-go.insteadOf" "https://github.com/sdlc-a2z/platform-lib-go"
            private="${private:+$private,}github.com/sdlc-a2z/platform-lib-go"
          fi
          if [ -n "$private" ]; then
            echo "GOPRIVATE=$private" >> "$GITHUB_ENV"
          fi

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # A workflow that does not parse never runs, and GitHub reports that as a
      # zero-second failure with no log. One sat undetected in this platform for weeks.
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

      - run: go vet ./...
      - run: go build ./...

      # An unprivileged role, because a superuser bypasses RLS: the tenancy suite would
      # pass while proving nothing, which is the commonest way such a suite lies.
      - name: Create the unprivileged test role
        if: inputs.needs-postgres
        env:
          PGPASSWORD: ephemeral-ci-only
        run: |
          psql -h localhost -p 5442 -U sdlc -d sdlc -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='platform_lib_app') \
             THEN CREATE ROLE platform_lib_app LOGIN PASSWORD 'ephemeral-ci-only' NOBYPASSRLS; END IF; END \$\$;"
          # Must run before migrations: a default-privileges rule only applies to objects
          # created afterward, by the same role (sdlc, the connection above). Without it,
          # migrations create tables platform_lib_app has no grant on at all — found live
          # on identity-service, the first time a caller's migration actually ran here
          # ("permission denied for table organizations").
          psql -h localhost -p 5442 -U sdlc -d sdlc -v ON_ERROR_STOP=1 -c \
            "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO platform_lib_app;"

      # Found live on identity-service, the first generated service with a real schema:
      # no service before it had migrations to run, so this step never existed and
      # nothing noticed. Runs as the bootstrap superuser (DDL rights the unprivileged
      # role above deliberately does not have), and is a silent no-op for a service with
      # no migrations/ directory yet, matching this workflow's own pattern for inputs a
      # given caller does not use.
      - name: Run migrations
        if: inputs.needs-postgres
        env:
          # sslmode=disable: golang-migrate's postgres driver defaults to require, and
          # this ephemeral container has no TLS at all — found live, the first time this
          # step actually ran against real migrations ("pq: SSL is not enabled on the
          # server"). The pgx-based Go code elsewhere in this job defaults to prefer,
          # which is why only this step needs it spelled out.
          DATABASE_URL: postgres://sdlc:ephemeral-ci-only@localhost:5442/sdlc?sslmode=disable
        run: |
          if ls migrations/*.up.sql >/dev/null 2>&1; then
            go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest \
              -path migrations -database "$DATABASE_URL" up
          else
            echo "no migrations/ directory — nothing to run"
          fi

      - name: Test
        env:
          # The suites t.Fatal rather than skip when CI is set, so the tenancy guarantee
          # can never go untested behind a green build.
          CI: true
          # The unprivileged role, not sdlc (the bootstrap superuser) — found live, the
          # first time a generated service's own tenancytest suite (which reads
          # DATABASE_URL directly, R0-WS2-007's shared harness) actually ran against this
          # workflow rather than platform-lib-go's own suite, which never reads
          # DATABASE_URL at all and so never exercised this value. A superuser connection
          # here would make every tenancy assertion pass while proving nothing — the exact
          # failure mode the role two steps up exists to prevent, silently defeated by
          # handing its own callers the wrong credential.
          DATABASE_URL: postgres://platform_lib_app:ephemeral-ci-only@localhost:5442/sdlc
          PLATFORM_LIB_TEST_ADMIN_URL: postgres://sdlc:ephemeral-ci-only@localhost:5442/sdlc
          PLATFORM_LIB_TEST_APP_URL: postgres://platform_lib_app:ephemeral-ci-only@localhost:5442/sdlc
        # -coverpkg=./...: without it, `go test ./...` only attributes coverage to the
        # package a test file lives in. identity-service's real logic lives in
        # internal/handlers and internal/store, exercised only by test/component (a
        # separate package, R0-WS2-007's convention for black-box tenancy/CRUD tests) —
        # found live, the first caller whose coverage came entirely from a separate test
        # package, reporting 0.0% total while every assertion passed.
        run: go test ./... -race -count=1 -coverprofile=coverage.out -coverpkg=./...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: $total%"
          awk -v t="$total" -v min="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit (t+0 >= min+0) ? 0 : 1 }' || {
              echo "::error::coverage $total% is below the ${{ inputs.coverage-threshold }}% Definition of Done"
              exit 1
            }

      # A CVE in a shared library reaches every service that imports it. GO-2026-6443, a
      # remotely triggerable gRPC server panic, was in the first version pinned.
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
