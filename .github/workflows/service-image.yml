# Builds, signs and pushes a service image.
#
# Separate from service-ci.yml so a caller that never builds one does not have to grant
# `id-token: write` — GitHub validates a called workflow's job permissions against the
# caller even for jobs that will be skipped.
#
#   jobs:
#     image:
#       needs: build
#       uses: sdlc-a2z/platform-workflows/.github/workflows/service-image.yml@v1
#       with:
#         service: job-service
#         registry: <host>/<project>/<repo>
#         registry-host: <host>
#         dockerfile: deploy/Dockerfile   # optional, this is the default
#       permissions: { contents: read, id-token: write, packages: write }
#       secrets: inherit

name: service-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      registry:
        description: Full image path. An input rather than a default, so this public
          repository names no infrastructure.
        required: true
        type: string
      registry-host:
        description: Registry host alone, for the docker login
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, for a repository building more than one
          image (e.g. the real app and a docs/tooling image) under different names.
        default: deploy/Dockerfile
        type: string
      python-index-host:
        description: >
          Bare host+path (no scheme, no credentials) of a private Python package index
          the Dockerfile's build stage needs, e.g.
          <region>-python.pkg.dev/<project>/<repo>/simple/. Passed as the
          PYTHON_INDEX_HOST build arg; the registry access token already fetched below is
          passed alongside it as the `gar_token` build secret, not a build arg, so it
          never lands in the image's build history. Leave empty for a Dockerfile with no
          such dependency — an input, not a default, for the same reason `registry` is
          one: this repository is public and names no infrastructure.
        required: false
        default: ''
        type: string

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    # The caller declares these too; a called workflow cannot exceed its caller.
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      # id and token_format are both required: without the id the login step cannot read
      # the output, and without token_format the action mints no access token.
      - name: Authenticate to the registry
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry-host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Pushed and referenced by digest, never by tag. Argo deploys a release train of
      # digests, and a tag would let the running image change with no commit saying so.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.service }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            PYTHON_INDEX_HOST=${{ inputs.python-index-host }}
          # Reuses the same token the registry login above already fetched — Artifact
          # Registry's Docker and Python surfaces authenticate the same identity the same
          # way, so this needs no second auth step. A no-op (empty secret value) when
          # python-index-host is empty; the Dockerfile ignores an empty/absent secret.
          secrets: |
            gar_token=${{ steps.auth.outputs.access_token }}
          provenance: true
          sbom: true

      # Keyless: the signature binds to this workflow's identity, so there is no signing
      # key to leak. Binary Authorization admits only images carrying one.
      - name: Sign the digest
        run: cosign sign --yes "${{ inputs.registry }}/${{ inputs.service }}@${{ steps.build.outputs.digest }}"

      # Values reach the script through `env:`, not by interpolating `${{ }}` into it.
      # A `${{ }}` in a `run:` block is textual substitution performed before the shell
      # sees the line, so a value containing a quote or a `$(` becomes script. Neither
      # of these is attacker-controlled, but the safe shape costs nothing and this is
      # the repository other workflows are copied from.
      - name: Record the digest
        env:
          SERVICE: ${{ inputs.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $SERVICE"
            echo "\`$DIGEST\`"
            echo ""
            echo "Add this digest to the release train in platform-deploy."
          } >> "$GITHUB_STEP_SUMMARY"
